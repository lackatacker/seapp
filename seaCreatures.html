<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Memory Challenge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
   <style>
    :root {
        --bg-color: #002855;
        --card-color: #004b8d;
        --active-color: #00b4d8;
        --text-color: #ffffff;
    }

    body { 
        font-family: sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color); 
        text-align: center; 
        margin: 0; 
        padding: 20px; 
    }

    .score-box { font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 350px; margin: 0 auto; }
    
    /* THE CARD BASE */
    .card {
        background-color: var(--card-color);
        border-radius: 20px;
        padding: 15px;
        transition: all 0.15s ease; /* Smooth transition for hover/click */
        border: 4px solid transparent;
        opacity: 0.8; /* Slightly dim by default */
        filter: brightness(0.9);
        cursor: pointer;
    }

    /* HOVER EFFECT (For Desktop testing) */
    .card:hover {
        opacity: 1;
        filter: brightness(1.2);
        transform: translateY(-2px); /* Slight lift */
    }

    /* CLICK EFFECT (The "Clear" look) */
    .card:active {
        opacity: 1;
        filter: brightness(1.5); /* Much brighter when pressed */
        background-color: var(--active-color);
        transform: scale(0.95); /* Slight "push in" effect */
    }

    /* STATE: When the game is showing the sequence */
    .card.playing {
        opacity: 1;
        filter: brightness(1.8);
        background-color: var(--active-color);
        transform: scale(1.1);
        border-color: white;
        box-shadow: 0 0 20px var(--active-color);
    }

    .card img { width: 70px; height: 70px; pointer-events: none; }
    .btn-start { background: #ffca3a; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
</style>
</head>
<body>

    <div class="score-box">Level: <span id="level-val">0</span></div>
    <h2 id="status">Press Start to Play</h2>

    <div class="grid">
        <div class="card" id="crab" onclick="handleUserClick('crab')"><img src="icons/crab.png"></div>
        <div class="card" id="dolphin" onclick="handleUserClick('dolphin')"><img src="icons/dolphin.png"></div>
        <div class="card" id="seaturtle" onclick="handleUserClick('seaturtle')"><img src="icons/seaturtle.png"></div>
        <div class="card" id="starfish" onclick="handleUserClick('starfish')"><img src="icons/starfish.png"></div>
    </div>

    <button id="start-btn" class="btn-start" onclick="startGame()">START GAME</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameSequence = [];
        let userSequence = [];
        let level = 0;
        let isPlayingSequence = false;

        const creatures = ['crab', 'dolphin', 'seaturtle', 'starfish'];

        function startGame() {
            gameSequence = [];
            level = 0;
            document.getElementById('start-btn').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            userSequence = [];
            level++;
            document.getElementById('level-val').innerText = level;
            document.getElementById('status').innerText = "Watch...";
            
            // Add a new random creature to the sequence
            const randomCreature = creatures[Math.floor(Math.random() * creatures.length)];
            gameSequence.push(randomCreature);

            playFullSequence();
        }

        async function playFullSequence() {
            isPlayingSequence = true;
            for (let i = 0; i < gameSequence.length; i++) {
                await playSingleSound(gameSequence[i]);
                await new Promise(res => setTimeout(res, 300)); // Gap between sounds
            }
            isPlayingSequence = false;
            document.getElementById('status').innerText = "Your Turn!";
        }

        function playSingleSound(id) {
            return new Promise(res => {
                const card = document.getElementById(id);
                const audio = new Audio(`sounds/${id}.wav`);
                
                card.classList.add('playing');
                audio.play();
                
                audio.onended = () => {
                    card.classList.remove('playing');
                    res();
                };
                // Fallback if sound fails
                setTimeout(() => { card.classList.remove('playing'); res(); }, 800);
            });
        }

        function handleUserClick(id) {
            if (isPlayingSequence) return; // Block clicking while game is "showing" the pattern

            userSequence.push(id);
            const clickAudio = new Audio(`sounds/${id}.wav`);
            clickAudio.play();

            // Check if the click was correct
            const currentIndex = userSequence.length - 1;
            if (userSequence[currentIndex] !== gameSequence[currentIndex]) {
                gameOver();
                return;
            }

            // Check if user finished the whole sequence
            if (userSequence.length === gameSequence.length) {
                document.getElementById('status').innerText = "Perfect! ✨";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                setTimeout(nextRound, 1000);
            }
        }

        function gameOver() {
            document.getElementById('status').innerText = "Game Over! 🐙";
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').innerText = 'TRY AGAIN';
        }
    </script>
</body>
</html>
