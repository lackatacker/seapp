<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Memory Challenge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #002855;
            --card-color: #004b8d;
            --active-color: #00b4d8;
            --text-color: #ffffff;
            --accent-color: #ffca3a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            text-align: center; 
            margin: 0; 
            padding: 20px;
            overflow: hidden;
            touch-action: manipulation;
        }

        .score-box { font-size: 1.5rem; margin-top: 10px; font-weight: bold; color: var(--accent-color); }
        #status { margin-bottom: 20px; min-height: 1.5em; }

        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            max-width: 320px; 
            margin: 0 auto; 
        }
        
        .card {
            background-color: var(--card-color);
            border-radius: 25%;
            padding: 20px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, filter 0.1s;
            border: 4px solid rgba(255,255,255,0.1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card img { width: 80%; height: auto; pointer-events: none; }

        /* User Press Effect */
        .card:active {
            transform: scale(0.9);
            filter: brightness(1.5);
        }

        /* Computer Sequence Animation */
        .card.playing {
            animation: flash 0.5s ease-in-out;
            border-color: white;
            z-index: 10;
        }

        @keyframes flash {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(2.5); background-color: var(--active-color); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .btn-start { 
            background: var(--accent-color); 
            border: none; 
            padding: 18px 40px; 
            border-radius: 50px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-top: 30px; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="score-box">LEVEL: <span id="level-val">0</span></div>
    <h2 id="status">Ready?</h2>

    <div class="grid">
        <div class="card" id="crab" onclick="handleUserClick('crab')"><img src="icons/crab.png" alt="Crab"></div>
        <div class="card" id="dolphin" onclick="handleUserClick('dolphin')"><img src="icons/dolphin.png" alt="Dolphin"></div>
        <div class="card" id="seaturtle" onclick="handleUserClick('seaturtle')"><img src="icons/seaturtle.png" alt="Turtle"></div>
        <div class="card" id="starfish" onclick="handleUserClick('starfish')"><img src="icons/starfish.png" alt="Starfish"></div>
    </div>

    <button id="start-btn" class="btn-start" onclick="startGame()">START GAME</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameSequence = [];
        let userSequence = [];
        let level = 0;
        let isPlayingSequence = false;

        const creatureIds = ['crab', 'dolphin', 'seaturtle', 'starfish'];
        
        // Pre-load audio objects to eliminate click latency
        const sounds = {};
        creatureIds.forEach(id => {
            sounds[id] = new Audio(`sounds/${id}.wav`);
            sounds[id].preload = 'auto';
        });

        function startGame() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            gameSequence = [];
            level = 0;
            document.getElementById('start-btn').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            userSequence = [];
            level++;
            document.getElementById('level-val').innerText = level;
            document.getElementById('status').innerText = "Watch...";
            
            const randomCreature = creatureIds[Math.floor(Math.random() * creatureIds.length)];
            gameSequence.push(randomCreature);

            // Small delay before starting sequence so player can prepare
            setTimeout(playFullSequence, 800);
        }

        async function playFullSequence() {
            isPlayingSequence = true;
            for (const id of gameSequence) {
                await animateAndPlay(id);
                await new Promise(res => setTimeout(res, 200)); 
            }
            isPlayingSequence = false;
            document.getElementById('status').innerText = "Your Turn!";
        }

        function animateAndPlay(id) {
            return new Promise(res => {
                const card = document.getElementById(id);
                const audio = sounds[id];
                
                card.classList.add('playing');
                audio.currentTime = 0;
                audio.play().catch(() => {}); // Catch browser policy blocks
                
                setTimeout(() => {
                    card.classList.remove('playing');
                    res();
                }, 500);
            });
        }

function handleUserClick(id) {
    if (isPlayingSequence) return;

    // 1. Appliquer l'animation visuelle immédiatement
    const card = document.getElementById(id);
    card.classList.remove('playing'); // On reset au cas où
    void card.offsetWidth; // Force le "reflow" pour redéclencher l'animation
    card.classList.add('playing');

    // 2. Retirer la classe après l'animation (500ms comme dans le CSS)
    setTimeout(() => {
        card.classList.remove('playing');
    }, 500);

    // 3. Son et Haptique
    sounds[id].currentTime = 0;
    sounds[id].play().catch(() => {});
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    // 4. Logique de jeu
    userSequence.push(id);
    const checkIdx = userSequence.length - 1;

    if (userSequence[checkIdx] !== gameSequence[checkIdx]) {
        gameOver();
        return;
    }

    if (userSequence.length === gameSequence.length) {
        document.getElementById('status').innerText = "Nice! ✨";
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        setTimeout(nextRound, 1000);
    }
}

        function gameOver() {
            document.getElementById('status').innerText = "Game Over! 🐙";
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            
            const btn = document.getElementById('start-btn');
            btn.style.display = 'inline-block';
            btn.innerText = 'TRY AGAIN';
        }
    </script>
</body>
</html>
